<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}پنل مدیریت فروشگاه{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <button class="menu-toggle" onclick="document.body.classList.toggle('sidebar-open')" aria-label="منو">☰</button>
  <aside class="sidebar">
    <div class="sidebar-brand">🛍️ پنل فروشگاه</div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="{{ 'active' if request.url.path == '/dashboard' or request.url.path == '/' }}">🏠 داشبورد</a>
      <a href="/orders" class="{{ 'active' if request.url.path.startswith('/orders') }}">🛒 سفارش‌ها</a>
      <a href="/inventory" class="{{ 'active' if request.url.path.startswith('/inventory') }}">📦 انبار</a>
      <a href="/attendance" class="{{ 'active' if request.url.path.startswith('/attendance') }}">👥 حضور و غیاب</a>
      <a href="/suggestions" class="{{ 'active' if request.url.path.startswith('/suggestions') }}">💡 پیشنهادات</a>
    </nav>
    <div class="sidebar-footer">نسخه ۱٫۰</div>
  </aside>
  <main class="content">
    <header class="page-header">
      <h1>{% block page_title %}{{ page_title }}{% endblock %}</h1>
      {% block header_actions %}{% endblock %}
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
