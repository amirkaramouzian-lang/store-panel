{% extends "base.html" %}
{% block content %}
<section class="card form-card">
  <form method="post" action="/attendance/staff/new">
    <div class="form-group"><label for="name">نام و نام خانوادگی</label><input type="text" id="name" name="name" required></div>
    <div class="form-group"><label for="role">سمت</label><input type="text" id="role" name="role"></div>
    <div class="form-group"><label for="phone">شماره تماس</label><input type="text" id="phone" name="phone"></div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">ذخیره کارمند</button>
      <a href="/attendance" class="btn btn-secondary">انصراف</a>
    </div>
  </form>
</section>
{% endblock %}
