{% extends "base.html" %}
{% block content %}
<section class="card form-card">
  <form method="post" action="/orders/new">
    <div class="form-group">
      <label for="customer_id">مشتری</label>
      <select name="customer_id" id="customer_id" required>
        {% for c in customers %}
        <option value="{{ c.id }}">{{ c.name }} {% if c.phone %}({{ c.phone }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>

    <h3>اقلام سفارش</h3>
    <div id="items-container">
      <div class="item-row">
        <div class="form-group">
          <label>محصول</label>
          <select name="product_id" required>
            {% for p in products %}
            <option value="{{ p.id }}">{{ p.name }} — موجودی: {{ p.quantity }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>تعداد</label>
          <input type="number" name="quantities" min="1" value="1" required>
        </div>
      </div>
    </div>
    <button type="button" class="btn btn-secondary" onclick="addItemRow()">+ افزودن قلم</button>

    <div class="form-group">
      <label for="notes">توضیحات</label>
      <textarea name="notes" id="notes" rows="3"></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">ثبت سفارش</button>
      <a href="/orders" class="btn btn-secondary">انصراف</a>
    </div>
  </form>
</section>

<script>
const products = {{ product_options | tojson }};
function addItemRow() {
  const container = document.getElementById('items-container');
  const row = document.createElement('div');
  row.className = 'item-row';
  const options = products.map(p => `<option value="${p.id}">${p.name} — موجودی: ${p.quantity}</option>`).join('');
  row.innerHTML = `
    <div class="form-group"><label>محصول</label><select name="product_id" required>${options}</select></div>
    <div class="form-group"><label>تعداد</label><input type="number" name="quantities" min="1" value="1" required></div>
    <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.item-row').remove()">✕</button>`;
  container.appendChild(row);
}
</script>
{% endblock %}
